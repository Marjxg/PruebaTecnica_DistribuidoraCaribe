<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Clientes</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <header class="header">

        <div class="container">

            <div class="header-top">

                <div>
                    <h1>Sistema de Ventas</h1>
                    <p>Gestión de clientes</p>
                </div>

                <button id="btnCerrarSesion" class="btn btn-secondary">
                    Cerrar sesión
                </button>

            </div>

            <nav class="nav">

                <a href="./index.html" class="nav-link active">
                    Clientes
                </a>

                <a href="./productos.html" class="nav-link">
                    Productos
                </a>

                <a href="./ventas.html" class="nav-link">
                    Ventas
                </a>

            </nav>

        </div>

    </header>




    <main class="container">

        <section class="page-header">

            <div>
                <h2>Clientes</h2>
                <p>Administra los clientes registrados en el sistema.</p>
            </div>

            <button id="btnNuevoCliente" class="btn btn-primary">
                + Nuevo cliente
            </button>

        </section>


        <!-- Mensajes -->
        <div id="mensaje" class="mensaje hidden">
        </div>


        <!-- Tabla -->
        <section class="card">

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>NIT</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaClientes">
                        <!-- JavaScript inserta los clientes aquí -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Modal -->
    <div id="modalCliente" class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitulo">
                    Nuevo cliente
                </h2>

                <button id="btnCerrarModal" class="btn-close">
                    ×
                </button>

            </div>


            <form id="formCliente">

                <input type="hidden" id="idCliente">


                <div class="form-group">

                    <label for="nombre">
                        Nombre *
                    </label>

                    <input type="text" id="nombre" maxlength="100" required>

                </div>


                <div class="form-group">

                    <label for="nit">
                        NIT
                    </label>

                    <input type="text" id="nit" maxlength="20">

                </div>


                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input type="text" id="telefono" maxlength="20">

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" maxlength="100">

                </div>

                <div class="form-group">

                    <label for="activo">
                        Estado
                    </label>

                    <select id="activo">

                        <option value="1">
                            Activo
                        </option>

                        <option value="0">
                            Inactivo
                        </option>

                    </select>

                </div>

                <div class="form-group" id="grupoPassword">

                    <label for="password">
                        Contraseña *
                    </label>

                    <input type="password" id="password" minlength="6" autocomplete="new-password">

                </div>




                <div class="form-actions">

                    <button type="button" id="btnCancelar" class="btn btn-secondary">
                        Cancelar
                    </button>

                    <button type="submit" class="btn btn-primary">
                        Guardar
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script type="module" src="./js/app.js"></script>

</body>

</html>
