<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Sistema de Ventas</title>

    <link rel="stylesheet" href="./css/styles.css">

</head>

<body>
    <header class="header">
        <div class="container">
            <h1>Sistema de Ventas</h1>
            <p>Inicio de sesión</p>
        </div>
    </header>

    <main class="container">

        <section class="card login-card">

            <h2>Iniciar sesión</h2>

            <p>
                Ingresa tus credenciales para continuar.
            </p>

            <div id="mensaje" class="mensaje hidden"></div>

            <form id="formLogin">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" maxlength="100" required autocomplete="email">

                </div>

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input type="password" id="password" required autocomplete="current-password">

                </div>

                <button type="submit" id="btnLogin" class="btn btn-primary">
                    Iniciar sesión
                </button>

            </form>

        </section>

    </main>

    <script type="module" src="./js/login.js"></script>

</body>

</html>
